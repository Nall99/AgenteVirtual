<div class="mx-auto max-w-3xl">
  <div
    class="flex items-end gap-2 rounded-2xl border border-zinc-200 bg-white p-2 shadow-sm transition focus-within:border-emerald-500 focus-within:ring-4 focus-within:ring-emerald-500/10 dark:border-zinc-800 dark:bg-zinc-900"
  >
    <textarea
      #box
      rows="1"
      maxlength="4000"
      [value]="draft()"
      (input)="draft.set(box.value)"
      (keydown)="onKeydown($event)"
      placeholder="Pergunte algo sobre medicina…"
      class="max-h-40 min-h-10 flex-1 resize-none bg-transparent px-2 py-2 text-sm outline-none field-sizing-content placeholder:text-zinc-400 dark:placeholder:text-zinc-500"
    ></textarea>

    <button
      type="button"
      (click)="submit()"
      [disabled]="!canSend()"
      class="grid size-10 shrink-0 place-items-center rounded-xl bg-emerald-600 text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-emerald-600"
      aria-label="Enviar"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>
  </div>
  <p class="mt-2 text-center text-xs text-zinc-400 dark:text-zinc-500">
    Ferramenta educacional. Confira doses e condutas em fontes oficiais.
  </p>
</div>
