<div class="flex h-dvh flex-col">
  <!-- Cabeçalho -->
  <header class="border-b border-zinc-200 dark:border-zinc-800">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="grid size-9 place-items-center rounded-xl bg-emerald-600 text-white">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </div>
        <div class="leading-tight">
          <h1 class="text-sm font-semibold">Electra</h1>
          <p class="hidden text-xs text-zinc-500 sm:block dark:text-zinc-400">
            Assistente de estudos de medicina
          </p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Seletor de modo -->
        <div class="flex rounded-lg bg-zinc-100 p-0.5 text-xs font-medium dark:bg-zinc-900">
          @for (m of modes; track m.value) {
            <button
              type="button"
              (click)="chat.mode.set(m.value)"
              class="rounded-md px-3 py-1.5 transition"
              [class]="
                chat.mode() === m.value
                  ? 'bg-white text-zinc-900 shadow-sm dark:bg-zinc-800 dark:text-zinc-100'
                  : 'text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100'
              "
            >
              {{ m.label }}
            </button>
          }
        </div>

        <!-- Aviso educacional -->
        <button
          type="button"
          (click)="showNotice()"
          class="grid size-9 place-items-center rounded-lg text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-zinc-100"
          aria-label="Sobre o aviso educacional"
          title="Aviso educacional"
        >
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4M12 8h.01" />
          </svg>
        </button>

        <!-- Alternar tema -->
        <button
          type="button"
          (click)="toggleTheme()"
          class="grid size-9 place-items-center rounded-lg text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-900 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-zinc-100"
          aria-label="Alternar tema"
          title="Alternar tema"
        >
          @if (dark()) {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          } @else {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          }
        </button>

        <!-- Limpar conversa -->
        <button
          type="button"
          (click)="confirmClear()"
          [disabled]="chat.messages().length === 0 && !chat.loading()"
          class="grid size-9 place-items-center rounded-lg text-zinc-500 transition hover:bg-zinc-100 hover:text-red-600 disabled:pointer-events-none disabled:opacity-40 dark:text-zinc-400 dark:hover:bg-zinc-900 dark:hover:text-red-400"
          aria-label="Limpar conversa"
          title="Limpar conversa"
        >
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Estado do servidor (planos gratuitos "dormem" e demoram para acordar) -->
  @if (server() === 'waking') {
    <div
      role="status"
      class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-xs text-amber-800 dark:border-amber-900/40 dark:bg-amber-950/30 dark:text-amber-300"
    >
      <div class="mx-auto flex max-w-3xl items-center gap-2">
        <svg class="size-4 shrink-0 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.22-8.56" />
        </svg>
        <span>Acordando o servidor gratuito… a primeira resposta pode levar até 1 minuto.</span>
      </div>
    </div>
  }
  @if (server() === 'offline') {
    <div
      role="alert"
      class="border-b border-red-200 bg-red-50 px-4 py-2 text-xs text-red-800 dark:border-red-900/40 dark:bg-red-950/30 dark:text-red-300"
    >
      <div class="mx-auto flex max-w-3xl items-center justify-between gap-3">
        <span>Não consegui conectar ao servidor.</span>
        <button type="button" (click)="checkServer()" class="shrink-0 font-medium underline underline-offset-2 hover:no-underline">
          Verificar de novo
        </button>
      </div>
    </div>
  }

  <!-- Mensagens -->
  <app-message-list
    [messages]="chat.messages()"
    [loading]="chat.loading()"
    [error]="chat.error()"
    (suggestionPicked)="send($event)"
    (retry)="retry()"
  />

  <!-- Campo de texto -->
  <app-message-input [busy]="chat.loading()" (send)="send($event)" />
</div>
